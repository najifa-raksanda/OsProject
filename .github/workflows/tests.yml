name: Tests

on:
  push:
    branches: [main, combined-improvements-ui, additional-improvements]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q exam_manager tests wsgi.py run.py
      - name: Run tests
        run: python -m pytest -q
